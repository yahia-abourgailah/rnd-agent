[project]
name = "rnd-agent"
version = "0.1.0"
description = "Competitive launch intelligence pipeline for The Address Investments"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prefect>=2.19",
    "scrapegraphai>=1.30",
    "openai>=1.30",
    "playwright>=1.44",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "alembic>=1.13",
    "rapidfuzz>=3.9",
    "celery>=5.4",
    "redis>=5.0",
    "slack-sdk>=3.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # chatbot_agent — previously imported but undeclared, so the agent only ran
    # where someone had pip-installed them by hand.
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Source registries and SQL/migration templates are runtime data, not just
# build inputs — without this they are missing from an installed copy.
[tool.setuptools.package-data]
config = ["*.yaml"]
db = ["migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Applied migrations are history: they are regenerated by Alembic, must not be
# edited after they have run anywhere, and their formatting is not ours.
extend-exclude = ["src/db/migrations/versions"]

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade doesn't silently change what CI enforces.
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF", "BLE"]
ignore = [
    # Fires on FastAPI's Depends()/Header() idiom, which is the documented way
    # to declare dependencies — the whole API layer would have to be rewritten.
    "B008",
    # Flags en/em dashes in docstrings and prose. They are deliberate.
    "RUF001",
    "RUF002",
    "RUF003",
    # str+Enum -> StrEnum changes what str(member) returns, so it is a behaviour
    # change that needs its own commit and test pass, not a lint autofix.
    "UP042",
]

[tool.ruff.lint.isort]
# Keep `X as Y` aliases in the same block as their plain siblings instead of
# exploding one import statement into eight.
combine-as-imports = true
