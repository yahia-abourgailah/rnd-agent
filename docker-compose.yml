# Base stack — shared by every environment. Intentionally does NOT publish
# host ports (that's a dev convenience added by docker-compose.override.yml).
#
#   Local dev:   docker compose up -d
#                (base + docker-compose.override.yml, auto-merged)
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Credentials default to dev values but can be overridden from the shell env
# (or an --env-file) so staging/prod supply their own without editing this file.
#
# Every environment reads a single `.env` at the repo root — Compose's own
# default file, so it feeds both the ${VAR} substitutions below and the api
# container's environment. Copy .env.example to .env; it is never committed.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-launch_intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-launch_intel}
      POSTGRES_DB: ${POSTGRES_DB:-launch_intel}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-runs on first startup only: enables the pgvector extension.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-launch_intel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    # Hostnames, not localhost: inside the network the database is `postgres`.
    # These override anything in env_file, which is written for host-side runs.
    environment: &container_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-launch_intel}:${POSTGRES_PASSWORD:-launch_intel}@postgres:5432/${POSTGRES_DB:-launch_intel}
      DATABASE_READONLY_URL: postgresql+psycopg://launch_intel_ro:${POSTGRES_RO_PASSWORD:-ro_local_dev}@postgres:5432/${POSTGRES_DB:-launch_intel}
      REDIS_URL: redis://redis:6379/0
      ENV_FILE: ""
    # Supplies LLM_BASE_URL, OPENAI_API_KEY and API_KEY without committing them.
    # Required on purpose: with it optional, a host missing the file started a
    # container with no API key (auth silently disabled) and no LLM_BASE_URL
    # (chat silently calling api.openai.com). Failing to start is the safer
    # outcome. Copy .env.example to .env and fill it in.
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Collection, run on demand rather than served. Built from the worker target
  # because Nawy's new-launches page is JS-rendered and needs Chromium, which
  # the api image deliberately does not carry:
  #
  #   docker compose run --rm collector python scripts/collect.py --source nawy
  #   docker compose run --rm collector python scripts/dedup.py
  #
  # The profile keeps it out of `docker compose up`; `run` enables it on demand.
  collector:
    build:
      context: .
      target: worker
    profiles: ["collect"]
    environment: *container_env
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  # TODO(phase-later): enable once the dashboard is wired up against Postgres.
  # metabase:
  #   image: metabase/metabase:latest
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - postgres

volumes:
  pgdata:
